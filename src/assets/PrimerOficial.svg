<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- El capitán y uniforme blanco de la marina (sin fondo, todo transparente alrededor) -->
  <g stroke="#0f1318" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- Torso (Uniforme Blanco de Gala) -->
    <path d="M 65 285 L 65 180 C 65 152, 92 136, 120 132 L 180 132 C 208 136, 235 152, 235 180 L 235 285 Q 150 306 65 285 Z" fill="#ffffff" />

    <!-- Camisa blanca y corbata negra -->
    <polygon points="118,132 150,185 182,132" fill="#ffffff" />
    <polygon points="143,152 157,152 159,180 150,192 141,180" fill="#14181f" />
    <polygon points="142,144 158,144 155,153 145,153" fill="#14181f" />

    <!-- Solapas de la chaqueta -->
    <path d="M 118 132 L 104 162 L 122 172 L 114 182 L 150 205 L 150 185 Z" fill="#ffffff" />
    <path d="M 182 132 L 196 162 L 178 172 L 186 182 L 150 205 L 150 185 Z" fill="#ffffff" />
    <!-- Línea central de cruce -->
    <line x1="150" y1="205" x2="132" y2="235" />

    <!-- Botones dorados del saco -->
    <circle cx="138" cy="218" r="5.5" fill="#f3b63a" />
    <circle cx="170" cy="218" r="5.5" fill="#f3b63a" />

    <!-- Medalla / Cinta en el pecho derecho -->
    <rect x="96" y="192" width="22" height="22" fill="#2c4163" />
    <rect x="98" y="186" width="18" height="22" fill="#9bc2e6" />
    <rect x="96" y="183" width="22" height="5" fill="#f3b63a" />
    <rect x="96" y="206" width="22" height="5" fill="#f3b63a" />

    <!-- Medallas adicionales pecho izquierdo -->
    <rect x="178" y="192" width="28" height="8" fill="#e05263" stroke="#0f1318" stroke-width="2" />
    <rect x="180" y="192" width="8" height="8" fill="#f3b63a" />
    <rect x="188" y="192" width="8" height="8" fill="#364f78" />

    <!-- Charreteras doradas -->
    <path d="M 74 150 L 112 134 L 116 144 L 78 160 C 73 162, 70 153, 74 150 Z" fill="#f3b63a" />
    <line x1="88" y1="147" x2="102" y2="141" stroke="#0f1318" stroke-width="2.5" />
    <line x1="91" y1="151" x2="105" y2="145" stroke="#0f1318" stroke-width="1.5" />
    
    <path d="M 226 150 L 188 134 L 184 144 L 222 160 C 227 162, 230 153, 226 150 Z" fill="#f3b63a" />
    <line x1="212" y1="147" x2="198" y2="141" stroke="#0f1318" stroke-width="2.5" />
    <line x1="209" y1="151" x2="195" y2="145" stroke="#0f1318" stroke-width="1.5" />

    <!-- Brazos doblados -->
    <path d="M 65 175 C 46 210, 48 255, 86 270 L 138 270 L 138 242 L 94 235 L 98 205" fill="#ffffff" />
    <polygon points="94,235 108,238 103,268 88,266" fill="#f3b63a" />
    <polygon points="108,238 117,240 112,269 103,268" fill="#f3b63a" />
    <polygon points="117,240 130,242 126,270 112,269" fill="#1e2226" />
    <circle cx="84" cy="242" r="5" fill="none" stroke="#f3b63a" stroke-width="3.5" />

    <path d="M 235 175 C 254 210, 252 255, 214 270 L 162 270 L 162 242 L 206 235 L 202 205" fill="#ffffff" />
    <polygon points="206,235 192,238 197,268 212,266" fill="#f3b63a" />
    <polygon points="192,238 183,240 188,269 197,268" fill="#f3b63a" />
    <polygon points="183,240 170,242 174,270 188,269" fill="#1e2226" />
    <circle cx="216" cy="242" r="5" fill="none" stroke="#f3b63a" stroke-width="3.5" />

    <!-- Manos entrelazadas -->
    <path d="M 126 244 C 138 238, 166 238, 174 246 L 172 278 C 160 286, 134 286, 126 276 Z" fill="#f4b192" />
    <line x1="130" y1="255" x2="152" y2="254" />
    <line x1="130" y1="265" x2="150" y2="264" />
    <line x1="132" y1="274" x2="148" y2="273" />

    <!-- Cabeza y Orejas -->
    <path d="M 114 82 C 102 80, 102 104, 115 103" fill="#f4b192" />
    <path d="M 113 88 Q 108 92 113 96" fill="none" />
    <path d="M 186 82 C 198 80, 198 104, 185 103" fill="#f4b192" />
    <path d="M 187 88 Q 192 92 187 96" fill="none" />

    <!-- Rostro -->
    <path d="M 114 58 L 186 58 L 185 112 C 185 138, 115 138, 115 112 Z" fill="#f4b192" />

    <!-- Cabello lateral oscuro -->
    <path d="M 114 58 L 122 58 L 118 82 L 114 82 Z" fill="#3a3d40" />
    <path d="M 186 58 L 178 58 L 182 82 L 186 82 Z" fill="#3a3d40" />

    <!-- Barba oscura completa -->
    <path d="M 115 80 C 118 98, 124 106, 130 106 C 134 99, 142 97, 150 97 C 158 97, 166 99, 170 106 C 176 106, 182 98, 185 80 L 188 114 C 188 145, 112 145, 112 114 Z" fill="#3a3d40" />
    
    <!-- Piel visible ampliada dentro de la barba para dar aire a la boca -->
    <path d="M 131 106 C 131 101, 169 101, 169 106 L 169 125 C 169 131, 156 131, 155 126 L 145 126 C 144 131, 131 131, 131 125 Z" fill="#f4b192" stroke-width="3" />

    <!-- BOCA EN ALERTA -->
    <path d="M 135 107 Q 150 103 165 107 C 166 121, 159 126, 150 126 C 141 126, 134 121, 135 107 Z" fill="#4a0e13" stroke="#0f1318" stroke-width="3.5" />
    <path d="M 137 107 Q 150 104 163 107 L 161 112 L 139 112 Z" fill="#ffffff" stroke="#0f1318" stroke-width="2" />
    <path d="M 140 120 Q 150 115 160 120 C 158 125, 142 125, 140 120 Z" fill="#ff5a6e" stroke="#0f1318" stroke-width="2" />

    <!-- Nariz -->
    <path d="M 146 74 C 148 84, 142 91, 145 95 C 148 98, 156 98, 158 93" fill="none" />

    <!-- OJOS EN ALERTA -->
    <circle cx="135" cy="82" r="6.5" fill="#ffffff" stroke-width="2.5" />
    <circle cx="135" cy="82" r="2.8" fill="#0f1318" stroke="none" />
    <circle cx="165" cy="82" r="6.5" fill="#ffffff" stroke-width="2.5" />
    <circle cx="165" cy="82" r="2.8" fill="#0f1318" stroke="none" />

    <!-- CEJAS FRUNCIDAS DE URGENCIA -->
    <path d="M 124 67 L 143 73 L 142 78 L 123 73 Z" fill="#3a3d40" stroke-width="3" />
    <path d="M 176 67 L 157 73 L 158 78 L 177 73 Z" fill="#3a3d40" stroke-width="3" />

    <!-- Una sola gota de sudor -->
    <path d="M 178 65 C 178 65, 183 72, 183 75 A 4.5 4.5 0 1 1 174 75 C 174 72, 178 65, 178 65 Z" fill="#63d2ff" stroke-width="2" />

    <!-- Gorra de Capitán (Plato Blanco, Visera y Banda Negras) -->
    <path d="M 102 44 C 102 12, 198 12, 198 44 C 198 54, 188 60, 188 60 L 112 60 C 112 60, 102 54, 102 44 Z" fill="#ffffff" />
    <path d="M 111 49 Q 150 40 189 49 L 188 59 L 112 59 Z" fill="#1e2226" />
    <path d="M 113 53 Q 150 44 187 53 L 186 58 Q 150 49 114 58 Z" fill="#f3b63a" />
    <circle cx="114" cy="56" r="3" fill="#f3b63a" />
    <circle cx="186" cy="56" r="3" fill="#f3b63a" />
    <path d="M 110 58 Q 150 52 190 58 C 190 65, 110 65, 110 58 Z" fill="#1e2226" />

    <!-- Emblema dorado con Ancla -->
    <ellipse cx="150" cy="34" rx="9" ry="12" fill="#1e2226" stroke="#f3b63a" stroke-width="1.5" />
    <circle cx="150" cy="34" r="7" fill="#f3b63a" />
    <circle cx="150" cy="30" r="1.5" fill="none" stroke-width="1.5" />
    <line x1="150" y1="31" x2="150" y2="39" stroke-width="1.5" />
    <line x1="147" y1="33" x2="153" y2="33" stroke-width="1.5" />
    <path d="M 145 36 Q 150 41 155 36" fill="none" stroke-width="1.5" />
  </g>
</svg>