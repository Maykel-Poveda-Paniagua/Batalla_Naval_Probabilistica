      <polygon points="143,156 157,156 159,184 150,196 141,184" fill="#14181f" />
      <polygon points="142,148 158,148 155,157 145,157" fill="#14181f" />

      <!-- Solapas de la chaqueta -->
      <path d="M 118 136 L 104 166 L 122 176 L 114 186 L 150 209 L 150 189 Z" fill="#ffffff" />
      <path d="M 182 136 L 196 166 L 178 176 L 186 186 L 150 209 L 150 189 Z" fill="#ffffff" />
      <line x1="150" y1="209" x2="132" y2="239" />

      <!-- Botones dorados -->
      <circle cx="138" cy="222" r="5.5" fill="#f3b63a" />
      <circle cx="170" cy="222" r="5.5" fill="#f3b63a" />

      <!-- Medallas -->
      <rect x="96" y="196" width="22" height="22" fill="#2c4163" />
      <rect x="98" y="190" width="18" height="22" fill="#9bc2e6" />
      <rect x="96" y="187" width="22" height="5" fill="#f3b63a" />
      <rect x="96" y="210" width="22" height="5" fill="#f3b63a" />

      <rect x="178" y="196" width="28" height="8" fill="#e05263" stroke="#0f1318" stroke-width="2" />
      <rect x="180" y="196" width="8" height="8" fill="#f3b63a" />
      <rect x="188" y="196" width="8" height="8" fill="#364f78" />

      <!-- Charreteras doradas -->
      <path d="M 74 154 L 112 138 L 116 148 L 78 164 C 73 166, 70 157, 74 154 Z" fill="#f3b63a" />
      <line x1="88" y1="151" x2="102" y2="145" stroke="#0f1318" stroke-width="2.5" />
      <line x1="91" y1="155" x2="105" y2="149" stroke="#0f1318" stroke-width="1.5" />

      <path d="M 226 154 L 188 138 L 184 148 L 222 164 C 227 166, 230 157, 226 154 Z" fill="#f3b63a" />
      <line x1="212" y1="151" x2="198" y2="145" stroke="#0f1318" stroke-width="2.5" />
      <line x1="209" y1="155" x2="195" y2="149" stroke="#0f1318" stroke-width="1.5" />

