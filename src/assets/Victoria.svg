      <path d="M 124 72 Q 134 65 143 71" fill="none" stroke="#3a3d40" stroke-width="4.5" />
      <path d="M 157 71 Q 166 65 176 72" fill="none" stroke="#3a3d40" stroke-width="4.5" />

      <!-- Gorra de Capitán (recta e impecable) -->
      <path d="M 102 48 C 102 16, 198 16, 198 48 C 198 58, 188 64, 188 64 L 112 64 C 112 64, 102 58, 102 48 Z" fill="#ffffff" />
      <path d="M 111 53 Q 150 44 189 53 L 188 63 L 112 63 Z" fill="#1e2226" />
      <path d="M 113 57 Q 150 48 187 57 L 186 62 Q 150 53 114 62 Z" fill="#f3b63a" />
      <circle cx="114" cy="60" r="3" fill="#f3b63a" />
      <circle cx="186" cy="60" r="3" fill="#f3b63a" />
      <path d="M 110 62 Q 150 56 190 62 C 190 69, 110 69, 110 62 Z" fill="#1e2226" />

      <!-- Emblema dorado con Ancla -->
      <ellipse cx="150" cy="38" rx="9" ry="12" fill="#1e2226" stroke="#f3b63a" stroke-width="1.5" />
      <circle cx="150" cy="38" r="7" fill="#f3b63a" />
      <circle cx="150" cy="34" r="1.5" fill="none" stroke-width="1.5" />
      <line x1="150" y1="35" x2="150" y2="43" stroke-width="1.5" />
      <line x1="147" y1="37" x2="153" y2="37" stroke-width="1.5" />
      <path d="M 145 40 Q 150 45 155 40" fill="none" stroke-width="1.5" />
