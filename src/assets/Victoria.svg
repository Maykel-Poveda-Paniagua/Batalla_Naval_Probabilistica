<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="cielo-victoria" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="100%" stop-color="#d49324" />
    </radialGradient>
    <clipPath id="marco-victoria">
      <rect x="6" y="6" width="288" height="288" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#marco-victoria)">
    <!-- FONDO: Cielo radiante -->
    <rect width="300" height="300" fill="url(#cielo-victoria)" />

    <!-- Rayos de sol -->
    <g fill="#ffffff" opacity="0.24">
      <polygon points="150,90 0,0 55,0" />
      <polygon points="150,90 245,0 300,0" />
      <polygon points="150,90 300,65 300,115" />
      <polygon points="150,90 0,65 0,115" />
    </g>

    <!-- Estrellas de celebración -->
    <polygon points="44,44 48,54 58,54 50,60 53,70 44,64 35,70 38,60 30,54 40,54" fill="#ffffff" opacity="0.85" />
    <polygon points="256,48 260,58 270,58 262,64 265,74 256,68 247,74 250,64 242,58 252,58" fill="#ffffff" opacity="0.85" />

    <!-- Mar azul brillante en calma -->
    <path d="M 0 152 Q 40 147 80 152 T 160 152 T 240 152 T 300 152 L 300 300 L 0 300 Z" fill="#1c75bc" stroke="#0f1318" stroke-width="3" />

    <!-- EL CAPITÁN (Mismo personaje y uniforme impecable, feliz) -->
    <g stroke="#0f1318" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
