      <path d="M 135 112 Q 150 115 165 112 C 165 126, 157 130, 150 130 C 143 130, 135 126, 135 112 Z" fill="#ffffff" stroke="#0f1318" stroke-width="3.5" />

      <!-- Nariz -->
      <path d="M 146 78 C 148 88, 142 95, 145 99 C 148 102, 156 102, 158 97" fill="none" />

      <!-- OJOS FELICES (arcos sonrientes) -->
      <path d="M 127 87 Q 135 78 143 87" fill="none" stroke="#0f1318" stroke-width="4" />
      <path d="M 157 87 Q 165 78 173 87" fill="none" stroke="#0f1318" stroke-width="4" />

