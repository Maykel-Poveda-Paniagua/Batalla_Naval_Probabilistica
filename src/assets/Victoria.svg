      <polygon points="94,239 108,242 103,272 88,270" fill="#f3b63a" />
      <polygon points="108,242 117,244 112,273 103,272" fill="#f3b63a" />
      <polygon points="117,244 130,246 126,274 112,273" fill="#1e2226" />
      <circle cx="84" cy="246" r="5" fill="none" stroke="#f3b63a" stroke-width="3.5" />

      <path d="M 235 179 C 254 214, 252 259, 214 274 L 162 274 L 162 246 L 206 239 L 202 209" fill="#ffffff" />
      <polygon points="206,239 192,242 197,272 212,270" fill="#f3b63a" />
      <polygon points="192,242 183,244 188,273 197,272" fill="#f3b63a" />
      <polygon points="183,244 170,246 174,274 188,273" fill="#1e2226" />
      <circle cx="216" cy="246" r="5" fill="none" stroke="#f3b63a" stroke-width="3.5" />

