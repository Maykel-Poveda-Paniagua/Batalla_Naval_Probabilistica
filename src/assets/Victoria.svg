      <line x1="130" y1="259" x2="152" y2="258" />
      <line x1="130" y1="269" x2="150" y2="268" />
      <line x1="132" y1="278" x2="148" y2="277" />

      <!-- Cabeza y Orejas -->
      <path d="M 114 86 C 102 84, 102 108, 115 107" fill="#f4b192" />
      <path d="M 113 92 Q 108 96 113 100" fill="none" />
      <path d="M 186 86 C 198 84, 198 108, 185 107" fill="#f4b192" />
      <path d="M 187 92 Q 192 96 187 100" fill="none" />

      <!-- Rostro -->
      <path d="M 114 62 L 186 62 L 185 116 C 185 142, 115 142, 115 116 Z" fill="#f4b192" />

      <!-- Cabello lateral oscuro -->
      <path d="M 114 62 L 122 62 L 118 86 L 114 86 Z" fill="#3a3d40" />
      <path d="M 186 62 L 178 62 L 182 86 L 186 86 Z" fill="#3a3d40" />

      <!-- Barba oscura completa -->
      <path d="M 115 84 C 118 102, 124 110, 130 110 C 134 103, 142 101, 150 101 C 158 101, 166 103, 170 110 C 176 110, 182 102, 185 84 L 188 118 C 188 149, 112 149, 112 118 Z" fill="#3a3d40" />

