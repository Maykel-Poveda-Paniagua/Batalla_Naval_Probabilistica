<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="cielo-derrota" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3a4759" />
      <stop offset="100%" stop-color="#141a24" />
    </radialGradient>
    <clipPath id="marco-derrota">
      <rect x="6" y="6" width="288" height="288" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#marco-derrota)">
    <!-- FONDO: Cielo tormentoso -->
    <rect width="300" height="300" fill="url(#cielo-derrota)" />

    <!-- Columnas de humo de la flota hundida -->
    <g fill="#232b36" opacity="0.85">
      <circle cx="48" cy="115" r="24" />
      <circle cx="66" cy="92" r="20" />
      <circle cx="80" cy="68" r="16" />
      <circle cx="248" cy="110" r="26" />
      <circle cx="232" cy="85" r="19" />
    </g>

    <!-- Barco 1 hundiéndose a la izquierda (proa inclinada) -->
    <g transform="translate(46, 138) rotate(-38)">
      <polygon points="-28,12 34,12 22,-10 -22,-10" fill="#4a5568" stroke="#0f1318" stroke-width="3" />
      <rect x="-8" y="-22" width="16" height="12" fill="#2d3748" stroke="#0f1318" stroke-width="2.5" />
      <!-- Llamas -->
      <path d="M -2 -22 Q -6 -34 2 -38 Q 8 -30 6 -22 Z" fill="#f68d4a" />
      <path d="M 10 -10 Q 14 -24 20 -26 Q 22 -16 18 -10 Z" fill="#d93829" />
    </g>

    <!-- Barco 2 hundiéndose a la derecha (popa levantada) -->
    <g transform="translate(252, 142) rotate(42)">
      <polygon points="-32,12 28,12 20,-10 -24,-10" fill="#4a5568" stroke="#0f1318" stroke-width="3" />
      <line x1="-10" y1="-10" x2="-10" y2="-28" stroke="#0f1318" stroke-width="3" />
      <path d="M -18 -10 Q -22 -24 -14 -28 Q -10 -18 -12 -10 Z" fill="#f68d4a" />
    </g>

    <!-- Mar agitado en el horizonte -->
    <path d="M 0 148 Q 35 140 70 148 T 140 148 T 210 148 T 300 148 L 300 300 L 0 300 Z" fill="#0e3a63" stroke="#0f1318" stroke-width="3" />
    <path d="M 12 162 Q 42 156 72 162" fill="none" stroke="#8fd3f4" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 225 160 Q 258 154 288 160" fill="none" stroke="#8fd3f4" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

    <!-- EL CAPITÁN (Misma estructura y uniforme, pero triste y chamuscado) -->
    <g stroke="#0f1318" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- Torso (Uniforme Blanco de Gala) -->
      <path d="M 65 292 L 65 184 C 65 156, 92 140, 120 136 L 180 136 C 208 140, 235 156, 235 184 L 235 292 Z" fill="#e8ecf2" />

      <!-- Manchas de hollín en el uniforme -->
      <ellipse cx="92" cy="172" rx="11" ry="6" fill="#2d3748" opacity="0.35" stroke="none" />
      <ellipse cx="205" cy="215" rx="13" ry="7" fill="#2d3748" opacity="0.35" stroke="none" />

      <!-- Camisa y corbata negra -->
      <polygon points="118,136 150,189 182,136" fill="#e8ecf2" />
      <polygon points="143,156 157,156 159,184 150,196 141,184" fill="#14181f" />
      <polygon points="142,148 158,148 155,157 145,157" fill="#14181f" />

      <!-- Solapas de la chaqueta -->
      <path d="M 118 136 L 104 166 L 122 176 L 114 186 L 150 209 L 150 189 Z" fill="#e8ecf2" />
      <path d="M 182 136 L 196 166 L 178 176 L 186 186 L 150 209 L 150 189 Z" fill="#e8ecf2" />
      <line x1="150" y1="209" x2="132" y2="239" />

      <!-- Botones dorados -->
      <circle cx="138" cy="222" r="5.5" fill="#d9a12b" />
      <circle cx="170" cy="222" r="5.5" fill="#d9a12b" />

      <!-- Medallas -->
      <rect x="96" y="196" width="22" height="22" fill="#2c4163" />
      <rect x="98" y="190" width="18" height="22" fill="#9bc2e6" />
      <rect x="96" y="187" width="22" height="5" fill="#d9a12b" />
      <rect x="96" y="210" width="22" height="5" fill="#d9a12b" />

      <rect x="178" y="196" width="28" height="8" fill="#e05263" stroke="#0f1318" stroke-width="2" />
      <rect x="180" y="196" width="8" height="8" fill="#d9a12b" />
      <rect x="188" y="196" width="8" height="8" fill="#364f78" />

      <!-- Charreteras doradas (una caída de lado) -->
      <path d="M 74 154 L 112 138 L 116 148 L 78 164 C 73 166, 70 157, 74 154 Z" fill="#d9a12b" />
      <g transform="rotate(14 205 148)">
        <path d="M 226 154 L 188 138 L 184 148 L 222 164 C 227 166, 230 157, 226 154 Z" fill="#d9a12b" />
      </g>

      <!-- Brazos doblados -->
      <path d="M 65 179 C 46 214, 48 259, 86 274 L 138 274 L 138 246 L 94 239 L 98 209" fill="#e8ecf2" />
      <polygon points="94,239 108,242 103,272 88,270" fill="#d9a12b" />
      <polygon points="108,242 117,244 112,273 103,272" fill="#d9a12b" />
      <polygon points="117,244 130,246 126,274 112,273" fill="#1e2226" />
      <circle cx="84" cy="246" r="5" fill="none" stroke="#d9a12b" stroke-width="3.5" />

      <path d="M 235 179 C 254 214, 252 259, 214 274 L 162 274 L 162 246 L 206 239 L 202 209" fill="#e8ecf2" />
      <polygon points="206,239 192,242 197,272 212,270" fill="#d9a12b" />
      <polygon points="192,242 183,244 188,273 197,272" fill="#d9a12b" />
      <polygon points="183,244 170,246 174,274 188,273" fill="#1e2226" />
      <circle cx="216" cy="246" r="5" fill="none" stroke="#d9a12b" stroke-width="3.5" />

      <!-- Manos entrelazadas -->
      <path d="M 126 248 C 138 242, 166 242, 174 250 L 172 282 C 160 290, 134 290, 126 280 Z" fill="#f4b192" />
      <line x1="130" y1="259" x2="152" y2="258" />
      <line x1="130" y1="269" x2="150" y2="268" />
      <line x1="132" y1="278" x2="148" y2="277" />

      <!-- Cabeza y Orejas -->
      <path d="M 114 86 C 102 84, 102 108, 115 107" fill="#f4b192" />
      <path d="M 113 92 Q 108 96 113 100" fill="none" />
      <path d="M 186 86 C 198 84, 198 108, 185 107" fill="#f4b192" />
      <path d="M 187 92 Q 192 96 187 100" fill="none" />

      <!-- Rostro -->
      <path d="M 114 62 L 186 62 L 185 116 C 185 142, 115 142, 115 116 Z" fill="#f4b192" />

      <!-- Cabello lateral oscuro -->
      <path d="M 114 62 L 122 62 L 118 86 L 114 86 Z" fill="#3a3d40" />
      <path d="M 186 62 L 178 62 L 182 86 L 186 86 Z" fill="#3a3d40" />

      <!-- Barba oscura completa -->
      <path d="M 115 84 C 118 102, 124 110, 130 110 C 134 103, 142 101, 150 101 C 158 101, 166 103, 170 110 C 176 110, 182 102, 185 84 L 188 118 C 188 149, 112 149, 112 118 Z" fill="#3a3d40" />

      <!-- Piel visible dentro de la barba -->
      <path d="M 131 110 C 131 105, 169 105, 169 110 L 169 129 C 169 135, 156 135, 155 130 L 145 130 C 144 135, 131 135, 131 129 Z" fill="#f4b192" stroke-width="3" />

      <!-- BOCA TRISTE / DESOLADA -->
      <path d="M 136 123 Q 150 112 164 123" fill="none" stroke="#0f1318" stroke-width="4" stroke-linecap="round" />

      <!-- Nariz -->
      <path d="M 146 78 C 148 88, 142 95, 145 99 C 148 102, 156 102, 158 97" fill="none" />

      <!-- OJOS TRISTES Y LLOROSOS -->
      <circle cx="135" cy="86" r="6.5" fill="#ffffff" stroke-width="2.5" />
      <circle cx="135" cy="88" r="2.8" fill="#0f1318" stroke="none" />
      <circle cx="133.8" cy="86.5" r="1.2" fill="#ffffff" stroke="none" />

      <circle cx="165" cy="86" r="6.5" fill="#ffffff" stroke-width="2.5" />
      <circle cx="165" cy="88" r="2.8" fill="#0f1318" stroke="none" />
      <circle cx="163.8" cy="86.5" r="1.2" fill="#ffffff" stroke="none" />

      <!-- Lágrimas cayendo -->
      <path d="M 129 93 C 129 93, 125 101, 125 104 A 3.8 3.8 0 1 0 132.5 104 C 132.5 101, 129 93, 129 93 Z" fill="#63d2ff" stroke="#0f1318" stroke-width="2" />
      <path d="M 171 93 C 171 93, 167 103, 167 106 A 3.8 3.8 0 1 0 174.5 106 C 174.5 103, 171 93, 171 93 Z" fill="#63d2ff" stroke="#0f1318" stroke-width="2" />

      <!-- CEJAS CAÍDAS DE TRISTEZA -->
      <path d="M 123 76 L 142 70 L 143 75 L 124 81 Z" fill="#3a3d40" stroke-width="3" />
      <path d="M 177 76 L 158 70 L 157 75 L 176 81 Z" fill="#3a3d40" stroke-width="3" />

      <!-- Gorra de Capitán torcida por la derrota -->
      <g transform="rotate(-7 150 45)">
        <path d="M 102 48 C 102 16, 198 16, 198 48 C 198 58, 188 64, 188 64 L 112 64 C 112 64, 102 58, 102 48 Z" fill="#e8ecf2" />
        <path d="M 111 53 Q 150 44 189 53 L 188 63 L 112 63 Z" fill="#1e2226" />
        <path d="M 113 57 Q 150 48 187 57 L 186 62 Q 150 53 114 62 Z" fill="#d9a12b" />
        <circle cx="114" cy="60" r="3" fill="#d9a12b" />
        <circle cx="186" cy="60" r="3" fill="#d9a12b" />
        <path d="M 110 62 Q 150 56 190 62 C 190 69, 110 69, 110 62 Z" fill="#1e2226" />

        <!-- Emblema dorado con Ancla -->
        <ellipse cx="150" cy="38" rx="9" ry="12" fill="#1e2226" stroke="#d9a12b" stroke-width="1.5" />
        <circle cx="150" cy="38" r="7" fill="#d9a12b" />
        <circle cx="150" cy="34" r="1.5" fill="none" stroke-width="1.5" />
        <line x1="150" y1="35" x2="150" y2="43" stroke-width="1.5" />
        <line x1="147" y1="37" x2="153" y2="37" stroke-width="1.5" />
        <path d="M 145 40 Q 150 45 155 40" fill="none" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- Borde exterior -->
  <rect x="6" y="6" width="288" height="288" rx="18" fill="none" stroke="#0f1318" stroke-width="5" />
</svg>